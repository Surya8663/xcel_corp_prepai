name: prepai

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: prepai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepai
      POSTGRES_PASSWORD: prepai_secret
      POSTGRES_DB: prepai_db
    ports:
      - "5432:5432"
    volumes:
      - prepai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepai -d prepai_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://prepai:prepai_secret@postgres:5432/prepai_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_NAME: PrepAI Backend
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prepai_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  prepai_postgres_data:
    name: prepai_postgres_data
